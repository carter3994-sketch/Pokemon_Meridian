name: Meridian Town Mapping Toolchain
on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/meridian-town-mapping.yml'
permissions:
  contents: read
jobs:
  town-toolchain-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Porymap MCP with renderer
        run: |
          python3 -m pip install --user 'porymap-mcp[render]==1.0.1'
      - name: Verify toolchain import and command
        run: |
          python3 - <<'PY'
          import importlib.metadata as metadata
          import importlib.util
          import json
          from pathlib import Path
          version=metadata.version("porymap-mcp")
          assert version=="1.0.1",version
          assert importlib.util.find_spec("porymap_mcp") is not None
          report={"tool":"porymap-mcp","version":version,"python_import":"passed","status":"installed_for_map-authoring_tests","map_mutations":"NOT RUN","render_validation":"NOT RUN"}
          dest=Path("build/meridian_town_toolchain")
          dest.mkdir(parents=True,exist_ok=True)
          (dest/"toolchain_report.json").write_text(json.dumps(report,indent=2)+"\n")
          print(json.dumps(report,indent=2))
          PY
      - name: Upload toolchain report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meridian-town-toolchain-smoke-test
          path: build/meridian_town_toolchain/
          if-no-files-found: warn

  landing-camp-layout-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install render dependencies
        run: python3 -m pip install --user Pillow
      - name: Construct disposable town map and engine tileset
        run: |
          python3 scripts/stage_meridian_shady_forest_tileset.py
          python3 scripts/generate_landing_camp_metatile_prototype.py
          python3 scripts/stage_landing_camp_map_templates.py
          python3 scripts/register_meridian_shady_forest_tileset.py
          python3 scripts/register_landing_camp_prototype.py
      - name: Render actual town layout and original-art concept
        run: |
          python3 scripts/render_meridian_actual_engine_map.py
          python3 scripts/build_meridian_camp_graphics.py
          test -s build/meridian_candidate_review/landing_camp_actual_engine_tiles_preview.png
          test -s build/meridian_camp_art/camp_48x40_art_direction_preview.png
      - name: Inspect repeated tiles in compiled layout
        continue-on-error: true
        run: python3 scripts/qa_meridian_landing_camp_repetition.py
      - name: Inspect actual rendered pixels
        continue-on-error: true
        run: python3 scripts/qa_meridian_rendered_tileset.py
      - name: Publish preview and rejection reports regardless of quality outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meridian-landing-camp-town-layout-review
          path: |
            build/meridian_candidate_review/
            build/meridian_camp_art/
            build/meridian_prototypes/manifest.json
          if-no-files-found: warn
          retention-days: 14
