name: Meridian External Tileset Visual Review
on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - 'scripts/audit_meridian_candidate_tileset.py'
      - 'scripts/audit_meridian_terrain_roles.py'
      - 'scripts/audit_meridian_gen3_candidate_binaries.py'
      - 'scripts/stage_meridian_shady_forest_tileset.py'
      - 'data/meridian_plans/landing_camp_arrival.json'
      - 'scripts/build_meridian_candidate_contact_sheet.py'
      - '.github/workflows/landing-camp-candidate-review.yml'
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python3 -m pip install Pillow
      - name: Audit map terrain and required art transitions
        run: python3 scripts/audit_meridian_terrain_roles.py
      - name: Verify candidate 4bpp tiles and metatile binary structure
        run: python3 scripts/audit_meridian_gen3_candidate_binaries.py
      - name: Stage native Shady Forest tileset and credits
        run: python3 scripts/stage_meridian_shady_forest_tileset.py
      - name: Fetch source example art for visual evaluation only
        run: |
          mkdir -p build/meridian_candidate_review
          python3 scripts/build_meridian_candidate_contact_sheet.py
      - name: Upload candidate comparison images
        uses: actions/upload-artifact@v4
        with:
          name: meridian-external-tileset-visual-review
          path: |
            build/meridian_candidate_review/
            build/meridian_shady_forest_staging/
          if-no-files-found: error
          retention-days: 14
