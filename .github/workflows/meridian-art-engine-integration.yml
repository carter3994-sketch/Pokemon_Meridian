name: Meridian Original Art Engine Integration
on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - 'scripts/integrate_meridian_original_camp_art.py'
      - 'scripts/build_meridian_camp_graphics.py'
      - 'scripts/render_meridian_actual_engine_map.py'
      - '.github/workflows/meridian-art-engine-integration.yml'
permissions:
  contents: read
concurrency:
  group: meridian-art-engine-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integrate-and-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install graphics dependencies
        run: python3 -m pip install --user Pillow
      - name: Generate original graphics and engine map scaffolding
        run: |
          python3 scripts/build_meridian_camp_graphics.py
          python3 scripts/stage_meridian_shady_forest_tileset.py
          python3 scripts/generate_landing_camp_metatile_prototype.py
          python3 scripts/stage_landing_camp_map_templates.py
          python3 scripts/register_meridian_shady_forest_tileset.py
          python3 scripts/register_landing_camp_prototype.py
      - name: Convert original art and TMX to actual engine assets
        run: python3 scripts/integrate_meridian_original_camp_art.py
      - name: Render actual engine graphics
        run: python3 scripts/render_meridian_actual_engine_map.py
      - name: Verify pixel-for-pixel match with authored concept
        run: |
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          import json
          root=Path("build")
          expected=Image.open(root/"meridian_camp_art/camp_48x40_art_direction_preview.png").convert("RGB")
          actual=Image.open(root/"meridian_candidate_review/landing_camp_actual_engine_tiles_preview.png").convert("RGB")
          assert expected.size==actual.size
          from PIL import ImageChops
          diff=ImageChops.difference(expected,actual)
          changed=sum(1 for pixel in diff.getdata() if pixel!=(0,0,0))
          report={"matching_pixels":expected.width*expected.height-changed,"different_pixels":changed,
          "total_pixels":expected.width*expected.height,
          "note":"Palette 0 transparency may produce differences; no silent approval"}
          (root/"meridian_candidate_review/artwork_engine_pixel_comparison.json").write_text(json.dumps(report,indent=2)+"\n")
          print(json.dumps(report,indent=2))
          assert changed==0, "Original artwork and engine preview differ; reject integration"
          PY
      - name: Structural repetition gate
        id: structure
        if: always() && hashFiles('build/meridian_candidate_review/landing_camp_actual_engine_tiles_preview.png') != ''
        continue-on-error: true
        run: python3 scripts/qa_meridian_landing_camp_repetition.py
      - name: Rendered pixel repetition gate
        id: pixels
        if: always() && hashFiles('build/meridian_candidate_review/landing_camp_actual_engine_tiles_preview.png') != ''
        continue-on-error: true
        run: python3 scripts/qa_meridian_rendered_tileset.py
      - name: Preserve all integration evidence on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meridian-original-art-engine-integration-review
          path: |
            build/meridian_candidate_review/
            build/meridian_camp_art/
          if-no-files-found: warn
          retention-days: 14
      - name: Enforce quality gates
        if: always()
        env:
          STRUCTURE: ${{ steps.structure.outcome }}
          PIXELS: ${{ steps.pixels.outcome }}
        run: |
          test "$STRUCTURE" = success
          test "$PIXELS" = success

      - name: Install Emerald build toolchain only after graphics approval
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev
      - name: Compile approved candidate ROM
        env:
          GAME_VERSION: EMERALD
          GAME_LANGUAGE: ENGLISH
          COMPARE: '0'
        run: make -j2
      - name: Verify candidate GBA header
        run: |
          python3 - <<'PY'
          from pathlib import Path
          rom=Path("pokeemerald.gba").read_bytes()
          assert 1024*1024<=len(rom)<=32*1024*1024
          assert rom[0xB2]==0x96
          assert sum(rom[0xA0:0xBE])&255==0xE7
          print("Approved candidate GBA validated:",len(rom),"bytes")
          PY
      - name: Upload ROM only after all graphics gates and compilation pass
        uses: actions/upload-artifact@v4
        with:
          name: meridian-original-art-approved-landing-camp-rom
          path: pokeemerald.gba
          if-no-files-found: error
          retention-days: 7
