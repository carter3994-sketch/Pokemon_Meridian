name: Legacy Landing Camp Placeholder Diagnostic
on:
  workflow_dispatch:
concurrency:
  group: landing-camp-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce external-art provenance gate
        run: |
          python3 scripts/validate_meridian_art_sources.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("data/meridian_plans/landing_camp_asset_inventory.json")
          data = json.loads(p.read_text())
          assert all(not c["import_allowed"] for c in data["candidates"]), "Unreviewed art unexpectedly marked importable"
          print("Candidate sheets remain reference-only; no external art approved for import")
          PY
      - name: Generate and register disposable debug map
        run: |
          python3 -m py_compile scripts/register_landing_camp_prototype.py
          python3 scripts/audit_landing_camp_metatiles.py
          python3 -m pip install Pillow
          python3 scripts/stage_meridian_shady_forest_tileset.py
          python3 scripts/generate_landing_camp_metatile_prototype.py
          python3 scripts/stage_landing_camp_map_templates.py
          python3 scripts/register_meridian_shady_forest_tileset.py
          python3 scripts/register_landing_camp_prototype.py
          grep -F 'MeridianLandingCampPrototype_MapScripts::' data/maps/MeridianLandingCampPrototype/scripts.inc
          grep -F 'data/maps/MeridianLandingCampPrototype/scripts.inc' data/event_scripts.s
          grep -F 'MAP_MERIDIAN_LANDING_CAMP_PROTOTYPE' src/new_game.c
          python3 -c 'from pathlib import Path; s=Path("data/event_scripts.s").read_text(); assert "\\\\n" not in s[-150:], "literal backslash-n in assembly"'
      - name: Render actual registered tileset against Landing Camp map binary
        run: python3 scripts/render_meridian_actual_engine_map.py
      - name: Reject repetitive compiled terrain before ROM testing
        run: |
          python3 scripts/qa_meridian_landing_camp_repetition.py
      - name: Reject visually repetitive and blank tileset artwork
        if: always() && hashFiles('build/meridian_candidate_review/landing_camp_actual_engine_tiles_preview.png') != ''
        run: python3 scripts/qa_meridian_rendered_tileset.py
      - name: Preserve quality-gate evidence even on rejection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meridian-tileset-quality-gate-evidence
          path: |
            build/meridian_candidate_review/landing_camp_actual_engine_tiles_preview.png
            build/meridian_candidate_review/repetition_gate_report.json
            build/meridian_candidate_review/rendered_tileset_quality_gate.json
          if-no-files-found: warn
          retention-days: 14
      - name: Render metatile visual review sheets
        run: |
          python3 -m pip install --user Pillow
          python3 scripts/render_landing_camp_metatile_atlas.py
      - name: Build original Meridian camp graphics workbench
        run: |
          python3 scripts/build_meridian_camp_graphics.py
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          p = Path("build/meridian_camp_art")
          atlas = Image.open(p / "camp_original_metatiles_indexed.png")
          preview = Image.open(p / "camp_48x40_art_direction_preview.png")
          assert atlas.mode == "P"
          assert preview.size == (768, 640)
          assert len(set(atlas.getdata())) <= 16
          import xml.etree.ElementTree as ET
          tmx = ET.parse(p / "camp_48x40_editable.tmx").getroot()
          assert (tmx.attrib["width"], tmx.attrib["height"]) == ("48", "40")
          layers = tmx.findall("layer")
          assert len(layers) == 2
          for layer in layers:
              entries = [int(v) for v in layer.find("data").text.replace("\\n","").split(",") if v.strip()]
              assert len(entries) == 48*40, (layer.attrib["name"],len(entries))
          assert layers[1].attrib["visible"] == "0"
          print("Verified indexed original metatile art and 48x40 preview")
          PY
      - name: Verify separate Meridian tileset symbol and map binding
        run: |
          grep -F 'const struct Tileset gTileset_MeridianShadyForest =' src/data/tilesets/headers.h
          grep -F 'gTileset_MeridianShadyForest' data/layouts/layouts.json
          python3 -m json.tool build/meridian_candidate_review/engine_registration_report.json
      - name: Upload original camp graphics workbench
        uses: actions/upload-artifact@v4
        with:
          name: meridian-camp-original-graphics-workbench
          path: build/meridian_camp_art/
          if-no-files-found: error
          retention-days: 14
      - name: Upload visual metatile atlases
        uses: actions/upload-artifact@v4
        with:
          name: meridian-landing-camp-metatile-atlases
          path: |
            build/meridian_prototypes/metatile_atlas_*.png
            build/meridian_prototypes/metatile_unresolved_*.txt
          if-no-files-found: error
          retention-days: 14
      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3
      - name: Inspect generated map inputs
        run: |
          python3 -m json.tool data/maps/map_groups.json > /dev/null
          python3 -m json.tool data/layouts/layouts.json > /dev/null
          find data -iname '*heal*location*' -maxdepth 4 -print
          git status --short | head -30
      - name: Compile prototype registration
        env:
          GAME_VERSION: EMERALD
          GAME_LANGUAGE: ENGLISH
          COMPARE: '0'
        run: make -j2
      - name: Validate experimental GBA output
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct
          rom = Path("pokeemerald.gba")
          data = rom.read_bytes()
          assert len(data) >= 1024 * 1024, f"ROM unexpectedly small: {len(data)}"
          assert len(data) <= 32 * 1024 * 1024, f"ROM exceeds GBA maximum: {len(data)}"
          assert data[0xB2] == 0x96, "Invalid GBA fixed header byte"
          assert data[0xA0:0xAC].strip(b"\\0 "), "Missing GBA game title"
          assert (sum(data[0xA0:0xBE]) & 255) == 0xE7, "Invalid GBA header checksum"
          print(f"Validated {rom.name}: {len(data):,} bytes, title={data[0xA0:0xAC]!r}")
          PY
      - name: Upload metatile inventory
        uses: actions/upload-artifact@v4
        with:
          name: meridian-landing-camp-metatile-inventory
          path: build/meridian_prototypes/metatile_inventory.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload tileset integration evidence
        uses: actions/upload-artifact@v4
        with:
          name: meridian-shady-forest-engine-registration
          path: |
            build/meridian_candidate_review/engine_registration_report.json
            build/meridian_candidate_review/actual_engine_map_preview_report.json
            build/meridian_candidate_review/landing_camp_actual_engine_tiles_preview.png
            build/meridian_shady_forest_staging/credits.md
          retention-days: 14
      - name: Upload experimental ROM
        uses: actions/upload-artifact@v4
        with:
          name: meridian-landing-camp-unreachable-debug-rom
          path: pokeemerald.gba
          if-no-files-found: error
          retention-days: 7
